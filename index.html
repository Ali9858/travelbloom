<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TravelBloom</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script defer src="js/data.js"></script>
    <script defer src="js/app.js"></script>
</head>
<body>

<!-- ================= LEFT SOCIAL BAR ================= -->
<div class="side-social">
    <a href="#"><img src="ImageForJSFinalProject/twitter.png" alt="twitter"></a>
    <a href="#"><img src="ImageForJSFinalProject/facebook.png" alt="facebook"></a>
    <a href="#"><img src="ImageForJSFinalProject/instagram.png" alt="instagram"></a>
    <a href="#"><img src="ImageForJSFinalProject/youtube.png" alt="youtube"></a>
</div>

<!-- ================= NAVBAR ================= -->
<header class="navbar">
    <div class="nav-inner container">
        <a href="index.html" class="logo">TravelBloom</a>
        <nav class="nav-links">
            <a class="active" href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>

        <!-- SEARCH BAR -->
        <div class="nav-search-container">
            <div class="nav-search">
                <i class="fas fa-search search-icon"></i>
                <input id="searchInput" type="text" placeholder="Search beach, temple, country">
                <button id="searchBtn">Search</button>
                <button id="clearBtn">Clear</button>
            </div>

        </div>
    </div>
</header>
<!-- ================= SEARCH OVERLAY RESULTS ================= -->
<div id="results" class="search-overlay hidden"></div>
<!-- ================= HERO ================= -->
<section class="hero">
    <div class="hero-content container">
        <h1>Explore Dream Destinations</h1>
        <p class="subtitle">
            The Travel Recommendation App helps users explore popular travel destinations through an interactive interface.
            Search for beaches, temples, countries, or cities to view images, descriptions, and local time.
        </p>
    </div>
</section>
<footer class="footer">
    <div class="container">
        <p>© <span id="year"></span> TravelBloom</p>
    </div>
</footer>
</body>
</html>
